# Configuration for the kadi-apps functional (Playwright) test suite.
#
# This config is intentionally separate from the unit-test configuration so the
# network-dependent functional tests are only collected when you run pytest from
# (or pointed at) the functional_tests/ directory, e.g.
#
#     pytest functional_tests --server test
#
[pytest]
# Only collect the tests in this directory.
testpaths = .

# Save screenshots / traces / videos for failed tests under ./test-results so a
# failed deployment check is debuggable after the fact.
addopts =
    --screenshot=only-on-failure
    --tracing=retain-on-failure
    --video=retain-on-failure
    --output=test-results

markers =
    smoke: page loads / link checks (no form interaction, no telemetry)
    find_attitude: Find Attitude tool tests
    telemetry: Find Attitude tests that require live MAUDE telemetry via the server (gated by --run-telemetry)
    navigation: list filter / sort / pagination / event navigation tests
